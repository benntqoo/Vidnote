# Vidnote 配置模板
# 使用方式：cp config.example.yaml config.yaml 然后按需修改。
# config.yaml 已在 .gitignore 中，不会误提交。
# 字段语义与默认值依据见 PLAN.md §5。

paths:
  # 工作根目录：每条视频一个子目录。必须在 D 盘（C 盘仅剩 150GB，D 盘 988GB）
  work_dir: "D:/Code/SideProject/Vidnote/work"
  model_dir: "D:/Code/SideProject/Vidnote/models"
  # 留空则按 PLAN.md §9.4 的顺序自动定位；显式指定可跳过搜索
  # 本机实测有效值：
  ffmpeg: null

runtime:
  device: "auto"            # auto | cuda | cpu。auto 会实测一次推理来判断 CUDA 是否真可用
  compute_type: "auto"      # auto → cuda:float16 / cpu:int8
  model: "large-v3"         # large-v3 | medium | small
  auto_concurrency: true    # true 则用 PLAN.md §3.2 的公式动态计算
  # 以下仅在 auto_concurrency: false 时生效（本机实测预期取值）
  max_download: 8
  max_frame: 4
  max_summarize: 4

transcribe:
  language: "zh"
  beam_size: 5
  vad_filter: true
  # ⚠️ initial_prompt 是**强参数**，不是调味项：它会改变 whisper 的分段与标点
  #    （实测同一音频：不加 → 681 段碎句无标点；加 → 662 段整句带标点，术语也更准）。
  #    它是「领域术语提示」——**内容是什么就写什么**，写错领域反而有害。
  #    本值是为回归基线所用的财经类测试视频填的，换内容类型请相应修改。
  #    验收基线 samples/transcript_gpu.txt 即在此值下产生，**改动它会使基线不可复现**。
  #    留空（""）表示不使用提示词，产出会变成无标点的碎句。
  initial_prompt: "这是一段关于AI量化交易的讲解，涉及回测、过拟合、夏普比率、特征工程、样本外验证等概念。"

frames:
  enabled: false            # 默认关。实测多数口播视频画面无独立信息量（见 docs/实测记录.md）
  scene_threshold: 0.3
  max_frames: 400
  sheet_cols: 6
  sheet_rows: 4

summarize:
  enabled: false            # true 才调用 API；默认关闭以保证离线可用
  base_url: "https://api.openai.com/v1"
  # 密钥不进本文件，走环境变量
  api_key_env: "VIDNOTE_API_KEY"
  model: "gpt-4o"
  template: "摘要+章节大纲+要点"

cookie:
  browser: "chromium"       # playwright 取 cookie 用的浏览器
  auto_refresh: true        # 检测到失效则自动重取（ttwid 约 24 小时过期）

download:
  rate_limit_per_min: 10    # 防平台风控。实测抖音对短时间大量请求敏感
  keep_intermediate: true   # false 则任务完成后删除视频/音频，只留转写稿
